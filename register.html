<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <meta name="google" content="notranslate" />
  <meta name="msapplication-tap-highlight" content="no">
  <link href="./assets/favicon.ico" rel="icon">
  <title>Megaun - Criar Conta</title>
  <link href="./main.82cfd66e.css" rel="stylesheet">
  <style>
    .auth-container {
      max-width: 480px;
      margin: 40px auto;
      padding: 40px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .auth-container h1 {
      font-size: 1.8em;
      color: #0099FF;
      margin-bottom: 8px;
      text-align: center;
    }
    .auth-container p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95em;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9em;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #0099FF;
      outline: none;
      box-shadow: 0 0 0 3px rgba(0,153,255,0.1);
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #0099FF;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #0077cc;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9em;
      color: #666;
    }
    .auth-footer a {
      color: #0099FF;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9em;
      display: none;
    }
    .alert.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }
    .alert.success {
      background: #efe;
      color: #363;
      border: 1px solid #cfc;
    }
  </style>
</head>
<body>
<header class="">
  <div class="navbar navbar-default visible-xs">
    <button type="button" class="navbar-toggle collapsed">
      <span class="sr-only">Toggle navigation</span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
    </button>
    <a href="./index.html" class="navbar-brand">Megaun</a>
  </div>
  <nav class="sidebar">
    <div class="navbar-collapse" id="navbar-collapse">
      <div class="site-header">
        <a class="site-brand" href="./index.html" title="Megaun" align="center">
          <p align="center" style="font-size:1.4em;font-weight:bold;color:#0099FF;">Megaun</p>
        </a>
        <p><b>Par de moedas:</b></p>
        <select id="par_moeda" onchange="run()">
          <option hidden disabled selected value> --/-- </option>
          <option value="usd">USD/BRL</option>
          <option value="cad">CAD/BRL</option>
          <option value="eur">EUR/BRL</option>
          <option value="gbp">GBP/BRL</option>
          <option value="ars">ARS/BRL</option>
          <option value="chf">CHF/BRL</option>
          <option value="aud">AUD/BRL</option>
          <option value="cny">CNY/BRL</option>
          <option value="ils">ILS/BRL</option>
        </select>
      </div>
      <ul class="nav">
        <li><a href="./index.html" title="">Home</a></li>
        <li><a href="./about.html" title="">Calendário Econômico</a></li>
        <li><a href="./services.html" title="">Resumo Técnico</a></li>
        <li><a href="./project.html" title="">Estudar Análise Técnica</a></li>
        <li><a href="./register.html" title="">Criar Conta</a></li>
        <li><a href="./login.html" title="">Entrar</a></li>
      </ul>
      <nav class="nav-footer">
        <p>© 2026 | Megaun</p>
      </nav>
    </div>
  </nav>
</header>
<main class="" id="main-collapse">
  <div class="auth-container">
    <h1>Criar Conta</h1>
    <p class="subtitle">Cadastre-se para acessar a plataforma Megaun</p>
    <div class="alert error" id="errorMsg"></div>
    <div class="alert success" id="successMsg"></div>
    <form id="registerForm" onsubmit="return register(event)">
      <div class="form-group">
        <label for="name">Nome Completo</label>
        <input type="text" id="name" name="name" required placeholder="Seu nome completo">
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label for="phone">Telefone (opcional)</label>
        <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres" minlength="6">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repita sua senha">
      </div>
      <button type="submit" class="btn-primary">Criar Conta</button>
    </form>
    <div class="auth-footer">
      Já tem uma conta? <a href="./login.html">Entrar</a>
    </div>
  </div>
</main>
<script>
function run() {
  var moeda_par = document.getElementById("par_moeda").value;
  var pages = {usd:"index.html",cad:"cad.html",eur:"eur.html",gbp:"gbp.html",ars:"ars.html",chf:"chf.html",aud:"aud.html",cny:"cny.html",ils:"ils.html"};
  if (pages[moeda_par]) window.location = pages[moeda_par];
}
function register(e) {
  e.preventDefault();
  var name = document.getElementById("name").value.trim();
  var email = document.getElementById("email").value.trim().toLowerCase();
  var phone = document.getElementById("phone").value.trim();
  var password = document.getElementById("password").value;
  var confirmPassword = document.getElementById("confirmPassword").value;
  var errorEl = document.getElementById("errorMsg");
  var successEl = document.getElementById("successMsg");
  errorEl.style.display = "none";
  successEl.style.display = "none";

  if (password !== confirmPassword) {
    errorEl.textContent = "As senhas não coincidem.";
    errorEl.style.display = "block";
    return false;
  }
  if (password.length < 6) {
    errorEl.textContent = "A senha deve ter no mínimo 6 caracteres.";
    errorEl.style.display = "block";
    return false;
  }

  var users = JSON.parse(localStorage.getItem("megaun_users") || "{}");
  if (users[email]) {
    errorEl.textContent = "Este e-mail já está cadastrado.";
    errorEl.style.display = "block";
    return false;
  }

  users[email] = { name: name, email: email, phone: phone, password: password };
  localStorage.setItem("megaun_users", JSON.stringify(users));

  successEl.textContent = "Conta criada com sucesso! Redirecionando para o login...";
  successEl.style.display = "block";
  setTimeout(function() { window.location.href = "./login.html"; }, 2000);
  return false;
}
</script>
<script>
document.addEventListener("DOMContentLoaded", function(event) {
  navbarToggleSidebar();
  navActivePage();
});
</script>
<script type="text/javascript" src="./main.85741bff.js"></script>
</body>
</html>
